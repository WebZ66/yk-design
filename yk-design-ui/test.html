<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //判断是否是同一秒
      function isSameSecond(time1, time2) {
        return Math.floor(time1 / 1000) === Math.floor(time2 / 1000)
      }
      const useCountDown = (options) => {
        let rafId
        let endTime
        let remain = options.time
        const getCurrentRemain = () => Math.max(endTime - Date.now(), 0)
        const start = () => {
          endTime = Date.now() + remain
          tick()
        }
        const microTick = () => {
          rafId = setTimeout(() => {
            setRemain(getCurrentRemain())

            if (remain > 0) {
              microTick()
            }
          }, 16.67)
        }
        const macroTick = () => {
          rafId = setTimeout(() => {
            const remainRemain = getCurrentRemain()
            if (!isSameSecond(remainRemain, remain) || remainRemain === 0) {
              //如果不是同一秒，说明时间变化了接近1s
              console.log('remainRemian',remainRemain)
              console.log('remain',remain)
              setRemain(remainRemain)
            }

            if (remain > 0) {
              macroTick()
            }
          }, 16.67)
        }

        const tick = () => {
          if (options.millisecond) {
            microTick()
          } else {
            macroTick()
          }
        }
        const setRemain = (value) => {
          remain = value
          if (options.onChange) {
            options.onChange(remain)
          }
        }

        tick()
        return {
          start,
        }
      }

      const { start } = useCountDown({
        time: 5 * 1000,
        millisecond: false,
        onChange: (res) => {
          console.log('倒计时变化了', Math.round(res/1000))
        },
      })
      start()
    </script>
  </body>
</html>
